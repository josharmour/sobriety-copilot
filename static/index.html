<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sobriety Copilot — 12-Step Recovery Companion">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sobriety Copilot">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=1783391263"/>

  <title>Sobriety Copilot</title>
  <script>
    // Beta opt-in, shared by sobrietycopilot.com and beta.sobrietycopilot.com
    // through a cookie on the parent domain. An opted-in visitor to the main
    // site goes straight to the beta (only if the beta answers, so a beta
    // outage never strands anyone); ?beta=off — the beta's "Back to the
    // regular site" link — clears the choice.
    (function () {
      // Off while the main site runs the same build as the beta; set true to
      // offer the next beta ("Try the beta" link + remembered redirect).
      var BETA_OPEN = false;
      var MAIN = 'sobrietycopilot.com', BETA = 'beta.' + MAIN;
      var host = location.hostname;
      var onMain = host === MAIN || host === 'www.' + MAIN;
      function remember(v) {
        document.cookie = 'sc_beta=' + v + '; Domain=.' + MAIN + '; Path=/; Max-Age=31536000; SameSite=Lax; Secure';
      }
      var params = new URLSearchParams(location.search);
      if (params.get('beta') === 'off') remember('0');
      if (params.get('beta') === 'on') remember('1');
      window.scBeta = { on: function () { remember('1'); }, host: host, main: MAIN, beta: BETA, open: BETA_OPEN };
      var optedIn = /(?:^|;\s*)sc_beta=1(?:;|$)/.test(document.cookie);
      if (BETA_OPEN && onMain && optedIn && params.get('beta') !== 'off') {
        var img = new Image(), done = false;
        img.onload = function () { if (!done) { done = true; location.replace('https://' + BETA + '/'); } };
        img.onerror = function () { done = true; };
        setTimeout(function () { done = true; }, 2500);
        img.src = 'https://' + BETA + '/favicon.png?ping=' + Date.now();
      }
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <style>
    flutter-view, flt-glass-pane {
      height: calc(100% - 24px) !important;
    }
    #carrier-compliance-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 24px;
      line-height: 24px;
      background: #0d1117;
      border-top: 1px solid #21262d;
      text-align: center;
      font-size: 11px;
      color: #8b949e;
      z-index: 9999;
      pointer-events: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #carrier-compliance-footer a {
      color: #2a9d8f;
      margin: 0 8px;
      text-decoration: none;
    }
    #carrier-compliance-footer a:hover {
      text-decoration: underline;
    }
    #carrier-compliance-footer .beta-badge {
      color: #f2c14e;
      font-weight: 600;
    }
    @media (max-width: 480px) {
      #carrier-compliance-footer { font-size: 10px; white-space: nowrap; overflow-x: auto; }
      #carrier-compliance-footer a { margin: 0 4px; }
    }
  </style>
</head>
<body>
  <footer id="carrier-compliance-footer">
    <a href="/sms-optin.html">Daily SMS &amp; Opt-In</a> &middot;
    <a href="/privacy.html">Privacy Policy</a> &middot;
    <a href="/terms.html">Terms of Service</a><span id="beta-links"></span>
  </footer>
  <script>
    (function () {
      var b = window.scBeta, el = document.getElementById('beta-links');
      if (!b || !el) return;
      if (b.host === b.beta) {
        el.innerHTML = ' &middot; <span class="beta-badge">Beta</span>' +
          '<a href="https://' + b.main + '/?beta=off">Back to the regular site</a>';
      } else if (b.open && (b.host === b.main || b.host === 'www.' + b.main)) {
        el.innerHTML = ' &middot; <a href="https://' + b.beta + '/" onclick="scBeta.on()">Try the beta</a>';
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
