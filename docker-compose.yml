x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  LLM_BASE_URL: "${LLM_BASE_URL:-http://10.0.0.10:8002/v1}"
  LLM_MODEL: "${LLM_MODEL:-dsv4}"
  # LLM_BASE_URL_DIFFUSION removed — single model on 10.0.0.10:8002
  # LLM_MODEL_DIFFUSION removed — single model on 10.0.0.10:8002
  LLM_BASE_URL_STANDARD: "${LLM_BASE_URL_STANDARD:-http://10.0.0.10:8002/v1}"
  LLM_MODEL_STANDARD: "${LLM_MODEL_STANDARD:-dsv4}"
  LLM_API_KEY: "${LLM_API_KEY:-ignored}"
  VLLM_ENABLE_THINKING: "${VLLM_ENABLE_THINKING:-1}"
  EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-ollama}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nomic-embed-text}"
  EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}"
  SENTENCE_TRANSFORMER_MODEL: "${SENTENCE_TRANSFORMER_MODEL:-/app/models/fine-tuned-embeddings}"
  BUG_REPORT_DB_PATH: "${BUG_REPORT_DB_PATH:-/home/app/memory/bug_reports.db}"
  ENABLE_HYDE: "${ENABLE_HYDE:-1}"
  OLLAMA_KEEP_ALIVE: "-1"
  OLLAMA_EMBED_BATCH_SIZE: "8"
  MAX_EMBED_WORDS: "320"
  MAX_EMBED_CHARS: "2000"
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_BATCH_SIZE: "256"
  DOCUMENTS_DIR: /app/documents
  RAG_COLLECTION: recovery_literature
  INDEX_QUEUE_NAME: indexing
  INDEX_TASK_TTL_SECONDS: "604800"
  CELERY_RESULT_EXPIRES: "86400"
  CELERY_VISIBILITY_TIMEOUT: "43200"
  RENDER_CACHE_DIR: /home/app/render_cache
  RENDER_CACHE_MAX_DOCUMENTS: "8"
  USER_MEMORY_DB_PATH: /home/app/memory/user_memory.db
  # Bug report admin token — gates GET /api/bugs (reads expose conversation
  # history). Override via .env on the host or in your environment. Generate:
  #   python3 -c "import secrets; print(secrets.token_hex(24))"
  # Visit the app once as /?admin=<value> to unlock the in-app bug viewer.
  BUG_ADMIN_TOKEN: "${BUG_ADMIN_TOKEN:-7fe8d9a7e8a43db0472dd8e927b5dcd8}"
  # Server-side chat transcript storage (debugging only). Default OFF — the
  # privacy policy promises chat history stays on the user's device.
  STORE_CHAT_HISTORY: "${STORE_CHAT_HISTORY:-0}"
  # Optional comma-separated Nominatim country filter (e.g. "us,ca").
  # Empty = worldwide, matching the NA aggregator's coverage.
  GEOCODE_COUNTRYCODES: "${GEOCODE_COUNTRYCODES:-}"
  # Forward chat photo attachments to the LLM as vision content parts.
  # Enable once the deployed model is confirmed multimodal.
  LLM_SUPPORTS_IMAGES: "${LLM_SUPPORTS_IMAGES:-0}"
  PIP_NO_CACHE_DIR: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

services:
  app:
    build: .
    image: sobriety-copilot-app
    restart: always
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./documents:/app/documents:ro
      - ./packs:/app/packs:ro
      - render_cache_data:/home/app/render_cache
      - user_memory_data:/home/app/memory
      - models_data:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

  worker:
    build: .
    image: sobriety-copilot-worker
    restart: always
    command: ["celery", "-A", "src.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "indexing"]
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./documents:/app/documents:ro
      - render_cache_data:/home/app/render_cache
      - models_data:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "no", "--save", "60", "1", "--stop-writes-on-bgsave-error", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    restart: always
    environment:
      PERSIST_DIRECTORY: /data
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/data
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: sobriety-copilot-nginx
    restart: always
    ports:
      - "8090:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 5

volumes:
  redis_data:
  chroma_data:
  render_cache_data:
  user_memory_data:
  models_data:
