x-app-env: &app-env
  REDIS_URL: redis://redis:6379/0
  LLM_BASE_URL: "${LLM_BASE_URL:-http://10.0.0.10:8002/v1}"
  LLM_MODEL: "${LLM_MODEL:-dsv4}"
  LLM_MODEL_FT: "${LLM_MODEL_FT:-}"
  # Latency circuit-breaker: when the primary generator's first-token time
  # exceeds SLOW_TTFT_MS, route to LLM_MODEL_FALLBACK for SLOW_COOLDOWN_S.
  LLM_MODEL_FALLBACK: "${LLM_MODEL_FALLBACK:-}"
  SLOW_TTFT_MS: "${SLOW_TTFT_MS:-5000}"
  SLOW_COOLDOWN_S: "${SLOW_COOLDOWN_S:-120}"
  # Cloud RAG context diet — cap injected context chars (smaller = faster prefill).
  RAG_MAX_CONTEXT_CHARS: "${RAG_MAX_CONTEXT_CHARS:-12000}"
  # LLM_BASE_URL_DIFFUSION removed — single model on 10.0.0.10:8002
  # LLM_MODEL_DIFFUSION removed — single model on 10.0.0.10:8002
  LLM_BASE_URL_STANDARD: "${LLM_BASE_URL_STANDARD:-http://10.0.0.10:8002/v1}"
  LLM_MODEL_STANDARD: "${LLM_MODEL_STANDARD:-dsv4}"
  LLM_API_KEY: "${LLM_API_KEY:-ignored}"
  VLLM_ENABLE_THINKING: "${VLLM_ENABLE_THINKING:-1}"
  EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-ollama}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nomic-embed-text}"
  EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}"
  # "minilm" (nomic-style prefixes, all-minilm index) or "gemma" (fine-tuned
  # EmbeddingGemma training-format prefixes). Must match the active collection.
  EMBEDDING_PREFIX_STYLE: "${EMBEDDING_PREFIX_STYLE:-minilm}"
  SENTENCE_TRANSFORMER_MODEL: "${SENTENCE_TRANSFORMER_MODEL:-/app/models/fine-tuned-embeddings}"
  # The embed microservice computes embeddings from this model path on its own
  # container; this mount is for app-side fallback only.
  BUG_REPORT_DB_PATH: "${BUG_REPORT_DB_PATH:-/home/app/memory/bug_reports.db}"
  ENABLE_HYDE: "${ENABLE_HYDE:-1}"
  OLLAMA_KEEP_ALIVE: "-1"
  OLLAMA_EMBED_BATCH_SIZE: "8"
  MAX_EMBED_WORDS: "320"
  MAX_EMBED_CHARS: "2000"
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_BATCH_SIZE: "256"
  DOCUMENTS_DIR: /app/documents
  RAG_COLLECTION: recovery_literature
  INDEX_QUEUE_NAME: indexing
  INDEX_TASK_TTL_SECONDS: "604800"
  CELERY_RESULT_EXPIRES: "86400"
  CELERY_VISIBILITY_TIMEOUT: "43200"
  RENDER_CACHE_DIR: /home/app/render_cache
  RENDER_CACHE_MAX_DOCUMENTS: "8"
  USER_MEMORY_DB_PATH: /home/app/memory/user_memory.db
  # Bug report admin token — gates GET /api/bugs (reads expose conversation
  # history). Override via .env on the host or in your environment. Generate:
  #   python3 -c "import secrets; print(secrets.token_hex(24))"
  # Visit the app once as /?admin=<value> to unlock the in-app bug viewer.
  BUG_ADMIN_TOKEN: "${BUG_ADMIN_TOKEN:-7fe8d9a7e8a43db0472dd8e927b5dcd8}"
  # Server-side chat transcript storage (debugging only). Default OFF — the
  # privacy policy promises chat history stays on the user's device.
  STORE_CHAT_HISTORY: "${STORE_CHAT_HISTORY:-0}"
  # Optional comma-separated Nominatim country filter (e.g. "us,ca").
  # Empty = worldwide, matching the NA aggregator's coverage.
  GEOCODE_COUNTRYCODES: "${GEOCODE_COUNTRYCODES:-}"
  # Forward chat photo attachments to the LLM as vision content parts.
  # Enable once the deployed model is confirmed multimodal.
  LLM_SUPPORTS_IMAGES: "${LLM_SUPPORTS_IMAGES:-0}"
  PIP_NO_CACHE_DIR: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

services:
  # Production generator: multimodal gemma4:12b on the R9700 (gfx1201) via ROCm.
  # Part of this stack so `docker compose up` brings the model up with the app —
  # a single "bump the stack" recovers the whole chat path incl. inference.
  # Also serves the box's other gemma consumers (Open WebUI, the mtgacoach
  # litellm fallback tier) via the published host port. Multimodal (vision/audio)
  # must run on ollama — the llama-server mmproj path crashes on gfx1201.
  ollama:
    image: ollama/ollama:rocm
    container_name: sobriety-copilot-ollama
    restart: always
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "44"    # video
      - "990"   # render
    environment:
      HSA_OVERRIDE_GFX_VERSION: "12.0.0"
      GPU_MAX_HW_QUEUES: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_HOST: "0.0.0.0:11434"
      # KV-cache budget on the 32GB R9700 (ComfyUI reserves 16GB, qwen competes):
      # NUM_PARALLEL=4 x 32K default ctx overflowed VRAM and swapped over the
      # Gen3-x4 eGPU link -> 25-35s TTFT. Cap ctx to 16K and serialize so the
      # KV cache fits in VRAM; typical RAG prompt is ~1.6K tokens. Bump PARALLEL
      # back up later only if VRAM headroom allows.
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - /home/joshu/.ollama:/root/.ollama
    ports:
      - "11434:11434"   # host port for Open WebUI + litellm (they use 10.0.0.100:11434)
    healthcheck:
      test: ["CMD-SHELL", "ollama ps >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  app:
    build: .
    image: sobriety-copilot-app
    restart: always
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./documents:/app/documents:ro
      - ./packs:/app/packs:ro
      - render_cache_data:/home/app/render_cache
      - user_memory_data:/home/app/memory
      - models_data:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
      ollama:
        condition: service_started
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

  worker:
    build: .
    image: sobriety-copilot-worker
    restart: always
    command: ["celery", "-A", "src.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "indexing"]
    environment:
      <<: *app-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./documents:/app/documents:ro
      - render_cache_data:/home/app/render_cache
      - models_data:/app/models:ro
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "no", "--save", "60", "1", "--stop-writes-on-bgsave-error", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    restart: always
    environment:
      PERSIST_DIRECTORY: /data
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/data
    expose:
      - "8000"

  # Embedding microservice for the fine-tuned EmbeddingGemma retriever.
  # DO NOT run this on the NAS: loading the model OOM-crash-looped the 8GB box
  # on 2026-07-09 and degraded prod chat. It runs on blackwell (10.0.0.10)
  # instead; this block is kept for dev/other hosts and gated behind an
  # explicit profile so a plain `docker-compose up -d` never starts it.
  embed:
    profiles: ["embed"]
    build:
      context: .
      dockerfile: Dockerfile.embed
    image: sobriety-copilot-embed
    restart: "no"
    environment:
      EMBED_HOST: "0.0.0.0"
      EMBED_PORT: "8190"
      RETRIEVER_MODEL_PATH: "/models/retriever-model"
    volumes:
      - ./models/retriever-model:/models/retriever-model:ro
    expose:
      - "8190"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: sobriety-copilot-nginx
    restart: always
    ports:
      - "8090:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 5

volumes:
  redis_data:
  chroma_data:
  render_cache_data:
  user_memory_data:
  models_data:
