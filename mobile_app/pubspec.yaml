name: sobriety_copilot_mobile
description: "Sobriety Copilot — a recovery-support chat app (Flutter port of the web app)."
publish_to: "none"
version: 1.1.2+4

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  http: ^1.3.0

  # Persistence
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  path: ^1.9.1
  sqflite: ^2.4.0
  crypto: ^3.0.6

  # Markdown rendering of assistant answers
  flutter_markdown_plus: ^1.0.3
  markdown: ^7.3.0

  # Formatting / dates
  intl: ^0.20.2

  # Launch tel:, https:, maps links
  url_launcher: ^6.3.1

  # Read answers aloud
  flutter_tts: ^4.2.0

  # Meeting search: location
  geolocator: ^13.0.2

  # Scan / OCR text into the input box; also photo attachments (camera + gallery)
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_commons: ^0.9.0

  # Mic voice input — record a clip, POST to /api/transcribe (gemma) for text.
  # 6.1.1 (not 5.x): 5.x caps record_linux <1.0.0 which is incompatible with the
  # newer record_platform_interface; 6.1.1 has a consistent federated set and still
  # supports Dart 3.11. 7.x needs Dart 3.12.
  record: ^6.1.1

  # Deep linking into the offline literature reader
  app_links: ^6.4.0

  # Connectivity awareness
  connectivity_plus: ^6.1.0
  sherpa_onnx: ^1.13.2
  audioplayers: ^6.7.1
  archive: ^4.0.9
  home_widget: ^0.9.3
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.2.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_gemma: ^1.0.0-rc.1
  flutter_gemma_litertlm: ^1.0.0-rc.1
  flutter_gemma_embeddings: ^1.0.0-rc.1
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.jpg"
    background_color: "#0d1117"
    theme_color: "#0d1117"
  image_path: "assets/icon/app_icon.jpg"
  remove_alpha_ios: true
  adaptive_icon_background: "#0d1117"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/daily/
