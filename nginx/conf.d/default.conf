server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location /api/ {
        set $app_upstream app:5000;
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # COPY static -> /usr/share/nginx/html flattens contents to root,
    # so /static/foo must resolve to /usr/share/nginx/html/foo.
    location /static/ {
        alias /usr/share/nginx/html/;
        try_files $uri =404;
    }

    # Service worker must be served from root so its scope covers the whole app.
    location = /service-worker.js {
        alias /usr/share/nginx/html/service-worker.js;
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        alias /usr/share/nginx/html/manifest.json;
        default_type application/manifest+json;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri =404;
    }
}
