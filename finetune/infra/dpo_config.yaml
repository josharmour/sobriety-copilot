# =============================================================================
# FT-D4: DPO QLoRA config — google/gemma-4-e2b-it
# =============================================================================
# This config is identical in structure to sft_config.yaml (FT-D3) but
# adapted for Direct Preference Optimization (DPO) using TRL's DPOTrainer.
#
# Starts FROM the SFT adapter at finetune/runs/sft-01/adapter.
#
# Beta choice: beta=0.15
#   Rationale — The DPO loss is:
#     L_DPO = -E[ log σ(β * log(π_θ(chosen) / π_ref(chosen)) -
#                         β * log(π_θ(rejected) / π_ref(rejected))) ]
#   where β (beta) controls the KL penalty against the reference (SFT) policy.
#   Higher β → stronger regularization toward the SFT model.
#
#   At ~1.5k preference pairs across 5 flaw categories:
#     beta=0.30  — strong regularization — safe but may not sufficiently
#                  reduce the targeted flaws
#     beta=0.15  → moderate — balances flaw reduction vs. retaining SFT
#                  knowledge; standard starting point for preference tuning
#                  of instruction-tuned models with moderate data budgets
#     beta=0.05  — weak KL — more aggressive flaw unlearning, but risks
#                  reward hacking / catastrophic forgetting
#
#   Tuning guidance:
#     - If the 20-step dry run shows loss instability → increase to 0.2
#     - If the E4 eval gate shows insufficient flaw reduction → decrease to 0.1
#
# Sequence length: 4096 (same as SFT).  No packing for DPO — each
# (prompt, chosen, rejected) triple is processed independently.  Chosen and
# rejected each fit within ~2k tokens after the shared prompt.
#
# No reference_model config here: DPOTrainer creates the reference model
# internally from the policy model (with LoRA disabled/bypassed).  The
# reference model always equals the SFT-base policy at step 0.
#
# Dataset schema (finetune/gen/dpo.jsonl — generated by C4 task):
#   {
#     "prompt": [{"role":"system","content":"..."},
#                {"role":"user","content":"..."}],
#     "chosen": [{"role":"assistant","content":"<flawless answer>"}],
#     "rejected": [{"role":"assistant","content":"<flawed answer>"}],
#     "meta": {
#       "flaw": "fake_lived_experience | hotline_when_unneeded |
#                ignores_passages | bracket_citations | rambles"
#     }
#   }
#
# Validation: 2% held-out stratified by meta.flaw category.
# =============================================================================

model:
  name: google/gemma-4-e2b-it
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2   # falls back to sdpa in dry-run

qlora:
  r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  modules_to_save: null
  use_dora: false
  init_lora_weights: true
  # 4-bit NF4 base (bitsandbytes)
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true

dpo:
  beta: 0.15                     # see beta choice rationale above
  loss_type: sigmoid             # standard DPO loss (sigmoid pairwise)
  reference_free: false          # use π_ref (the SFT adapter) as baseline
  label_smoothing: 0.0           # no label smoothing
  # DPOTrainer handles ref model internally — no separate ref_model config

training:
  sequence_length: 4096
  packing: false                 # DPO processes pairs, not packed sequences
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  max_steps: -1
  learning_rate: 1.0e-5          # DPO typically uses lower LR than SFT
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  optim: adamw_torch_fused
  gradient_checkpointing: true
  bf16: true
  tf32: true
  max_grad_norm: 1.0

evaluation:
  eval_strategy: steps
  eval_steps: 50
  eval_on_start: true

logging:
  logging_strategy: steps
  logging_steps: 10
  report_to: none

checkpointing:
  save_strategy: steps
  save_steps: 100
  save_total_limit: 3
  load_best_model_at_end: false

dataset:
  train_val_split: 0.98
  stratify_by: flaw              # stratify by DPO flaw category

seed: 42
output_dir: finetune/runs/dpo-01
